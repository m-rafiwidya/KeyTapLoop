name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the screenshots step update the ci-screenshots branch

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      # The UI tests render the real windows in light and dark and save pictures of them.
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeyTapLoop-ui-screenshots
          path: ui-screenshots/*.png
          retention-days: 30
          if-no-files-found: warn

      # Keeps the latest screenshots on a branch, so they can be opened straight from the repository.
      - name: Update screenshots branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if ls ui-screenshots/*.png >/dev/null 2>&1; then
            tmp=$(mktemp -d)
            cp ui-screenshots/*.png "$tmp"/
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git checkout --orphan ci-screenshots
            git rm -rf --quiet . || true
            cp "$tmp"/*.png .
            git add -- *.png
            git commit -q -m "UI screenshots for ${GITHUB_SHA}"
            git push --force origin ci-screenshots
          fi

      - name: Publish portable build
        run: ./scripts/publish.ps1
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: KeyTapLoop-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          retention-days: 30
