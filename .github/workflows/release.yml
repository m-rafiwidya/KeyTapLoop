name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish portable build
        run: ./scripts/publish.ps1
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip artifacts/*.sha256 \
            --title "KeyTapLoop ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md
